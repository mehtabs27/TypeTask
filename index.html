<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeTasks — A Type-Safe Task Tracker</title>
  <meta name="description" content="A small, type-safe task tracker built with HTML, CSS, and TypeScript." />
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
<div class="wrap">
  <h1 class="brand">Mehtab's TypeTasks</h1>
  <p class="tagline">A type-safe plan for everything that matters.</p>
  <div class="addrow">
    <input id="title" placeholder="Add a task…" />
    <select id="status">
      <option value="todo">todo</option>
      <option value="in-progress">in-progress</option>
      <option value="done">done</option>
    </select>
    <button id="add">Add</button>
  </div>
  <div id="chips"></div>
  <ul id="list"></ul>
</div>

<!-- load the COMPILED js, as a module so it can import model.js -->
<script type="module" src="app.js"></script>
</body>
</html>
